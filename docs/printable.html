<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>CV - Version Imprimable</title>
    <link rel="stylesheet" href="css/print-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <script src="js/print-script.js" defer></script>
    <!-- Print-specific meta tags -->
    <meta name="format-detection" content="telephone=no">
    <meta name="format-detection" content="date=no">
    <meta name="format-detection" content="address=no">
    <meta name="format-detection" content="email=no">
</head>

<body class="light-bg">
    <div class="container">
        <!-- Left Column -->
        <div class="left-column primary-border">
            <img id="profile-pic" class="profile-pic" src="" alt="">
            <h1 id="name"></h1>
            <h4 id="title"></h4>
            <h5 id="subtitle"></h5>

            <!-- Contact Info -->
            <p id="email"><i class="fas fa-envelope"></i> <span></span></p>
            <p id="phone"><i class="fas fa-phone"></i> <span></span></p>
            <p id="location"><i class="fas fa-map-marker-alt"></i> <span></span></p>

            <!-- Key Points Section -->
            <div class="key-points-section">
                <h3 id="keyPoints-title"></h3>
                <div id="keyPoints" class="key-points-content">
                    <!-- Key Points dynamically generated via JavaScript -->
                </div>
            </div>

            <!-- Skills Section -->
            <h2 id="skills-title"></h2>
            <div id="skills"></div>

            <!-- Languages -->
            <h2 id="languages-title"></h2>
            <ul id="languages">
                <!-- Languages dynamically generated via JavaScript -->
            </ul>

            <!-- Technical Interests -->
            <h2 id="technicalInterests-title"></h2>
            <ul id="technicalInterests">
                <!-- Technical Interests dynamically generated via JavaScript -->
            </ul>

            <!-- Continuous Learning -->
            <h2 id="continuousLearning-title"></h2>
            <ul id="continuousLearning">
                <!-- Continuous Learning dynamically generated via JavaScript -->
            </ul>
        </div>

        <!-- Right Column -->
        <div class="right-column">
            <!-- Professional Summary -->
            <div class="summary-section">
                <h2 id="summary-title"></h2>
                <p id="profile-text" class="profile-description"></p>
            </div>

            <!-- Experience -->
            <div id="experience" class="experience-section">
                <h2 id="experience-title"></h2>
                <!-- Experience dynamically generated via JavaScript -->
            </div>

            <!-- Education -->
            <h2 id="education-title"></h2>
            <ul id="education">
                <!-- Education dynamically generated via JavaScript -->
            </ul>

            <!-- Certifications -->
            <h2 id="certifications-title"></h2>
            <ul id="certifications">
                <!-- Certifications dynamically generated via JavaScript -->
            </ul>
        </div>
    </div>
</body>

</html>
